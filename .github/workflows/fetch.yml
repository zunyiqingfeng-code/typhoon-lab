name: fetch-typhoon-data

on:
  schedule:
    - cron: "8 * * * *"      # 每小时第8分（UTC，best-effort，可能延迟数分钟）
  workflow_dispatch: {}       # 手动触发入口

concurrency:
  group: fetch-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # PAGASA 公报 PDF 解析需要 pypdf；其余源纯标准库
      - name: 安装 pypdf（PAGASA 公报解析）
        run: pip install pypdf

      # multi：主源(zjwater/nmc) + 补充源(KMA/HKO/PAGASA/CWA/JTWC-UCAR)
      # 补充源各自独立失败不拖累主流程；主源全失败退出码 2 → 自然红灯
      - name: 抓取并合并归档
        run: python3 fetch_typhoon.py --source multi

      - name: 重建主索引与跨年评分
        run: |
          python3 fetch_typhoon.py --reindex
          node scripts/score_archive.mjs

      # JMA 实时镜像（前端直连受限时的降级通道）+ 档案指标预计算
      # 两者都失败不打断主流程（realtime/records 有历史版本兜底）
      - name: JMA 镜像与档案记录
        run: |
          python3 scripts/fetch_jma_live.py || echo "JMA 镜像抓取失败（忽略）"
          python3 scripts/build_records.py || echo "records 构建失败（忽略）"

      # 台风数/轨迹点骤降 → 红灯，GitHub 自动邮件告警（免第三方）
      - name: 健康检查（趋势告警）
        run: python3 scripts/ci_healthcheck.py

      - name: 有变更才提交
        run: |
          git config user.name  "typhoon-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "无数据变更，跳过提交"
          else
            git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC 自动抓取"
            git push
          fi

# 备注：
# 1. Actions 跑在境外 runner，若 zjwater/nmc 对境外封禁导致持续失败，
#    退路 A：自己机器 crontab 跑同一脚本再 push；
#    退路 B：腾讯云函数（境内出口）+ 定时触发器，写 COS。
# 2. 告警走「红灯」：抓取失败(退出2) 或 健康检查骤降 都会让本次 run 失败，
#    GitHub 默认给仓库所有者发邮件。要更强可加 Server酱/webhook step（需 secret）。
