<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台风复盘台 · 回溯校验</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
:root{
  --ink:#0a1420; --sea:#0d1b2c; --land:#16283a; --coast:#2c4a63;
  --panel:rgba(13,26,40,.9); --line:rgba(87,215,201,.14);
  --text:#d7e3ee; --dim:#7b93a8; --accent:#57d7c9; --warn:#e33e3e; --good:#35c46a;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --td:#35c46a; --ts:#3f8ef7; --sts:#f2c744; --ty:#f2872e; --sty:#ef5aa0; --sup:#e33e3e;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--sans);
  font-size:13px;overflow:hidden}
#map{position:absolute;inset:0}

/* 顶栏 */
#brand{position:absolute;top:14px;left:16px;z-index:5;pointer-events:none}
#brand .lab{font-size:11px;letter-spacing:.32em;color:var(--dim)}
#brand .now{margin-top:6px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  pointer-events:auto}
#brand .zh{font-size:24px;font-weight:700;letter-spacing:.05em}
#brand .en{font-family:var(--mono);font-size:12px;color:var(--dim)}
.tag{font-size:11px;padding:2px 8px;border-radius:3px;font-weight:700;
  letter-spacing:.06em;background:#243a4f;color:#c6d4e0}
.tag.hind{background:var(--accent);color:#08131d}

/* 台风选择器 */
#picker{position:absolute;top:14px;right:16px;z-index:6;width:280px}
#picker input{width:100%;background:var(--panel);border:1px solid var(--line);
  color:var(--text);font:inherit;font-size:12px;padding:7px 10px;border-radius:5px;
  outline:none}
#picker input:focus{border-color:var(--accent)}
#plist{margin-top:6px;max-height:340px;overflow-y:auto;scrollbar-width:thin;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;display:none}
#plist.open{display:block}
.pyear{font-family:var(--mono);font-size:10px;color:var(--dim);padding:6px 10px 2px;
  position:sticky;top:0;background:var(--panel);letter-spacing:.1em}
.prow{display:flex;align-items:center;gap:8px;padding:5px 10px;cursor:pointer}
.prow:hover{background:rgba(87,215,201,.08)}
.prow .dot{width:8px;height:8px;border-radius:2px;flex:none}
.prow .nm{flex:1}
.prow .meta{font-family:var(--mono);font-size:10px;color:var(--dim)}

/* 右栏 */
#rail{position:absolute;top:92px;right:16px;z-index:5;width:280px;
  display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 210px);
  overflow-y:auto;scrollbar-width:thin}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:10px 12px;backdrop-filter:blur(3px)}
.card h3{margin:0 0 8px;font-size:10px;font-weight:400;color:var(--dim);
  letter-spacing:.22em}
.ag-row{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;
  user-select:none}
.ag-row input{accent-color:var(--accent)}
.ag-row .sw{width:16px;height:0;border-top:3px solid currentColor;border-radius:2px}
.ag-row .nm{font-family:var(--mono);font-size:12px}
.ag-row .zh{font-size:10px;color:var(--dim)}
.ag-row .err{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text)}

/* 误差榜 */
table.board{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px}
table.board th{font-weight:400;color:var(--dim);font-size:10px;padding:3px 4px;
  text-align:right}
table.board th.l,table.board td.l{text-align:left}
table.board td{padding:3px 4px;text-align:right}
table.board tr.best td{color:var(--good)}
.rankdot{display:inline-block;width:16px;color:var(--dim);text-align:center}

/* 底部：发布时刻时间轴 */
#tl{position:absolute;left:16px;right:16px;bottom:34px;z-index:5;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:8px 12px 10px;backdrop-filter:blur(3px)}
#tl-top{display:flex;align-items:center;gap:10px}
#play{width:26px;height:26px;border-radius:4px;border:1px solid var(--line);
  background:none;color:var(--accent);cursor:pointer;font-size:12px;flex:none}
#tl-when{font-family:var(--mono);font-size:12px;min-width:150px}
#tl-lab{font-size:11px;color:var(--dim)}
#scrub{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;
  background:#1b3247;outline:none}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:20px;
  border-radius:3px;background:var(--accent);cursor:pointer}
#scrub::-moz-range-thumb{width:12px;height:20px;border-radius:3px;
  background:var(--accent);border:0;cursor:pointer}

#foot{position:absolute;left:16px;right:16px;bottom:8px;z-index:5;
  display:flex;justify-content:space-between;gap:12px;font-size:10px;color:var(--dim)}
a{color:var(--accent)}

#notice{position:absolute;inset:0;display:grid;place-items:center;z-index:9;
  background:rgba(10,20,32,.72)}
#notice .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:22px 28px;max-width:440px;text-align:center;line-height:1.9}
#notice code{font-family:var(--mono);color:var(--accent)}
.maplibregl-popup-content{background:var(--panel);color:var(--text);
  font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:5px}
.maplibregl-ctrl-attrib{background:rgba(13,26,40,.6)!important;font-size:10px}
</style>
</head>
<body>
<div id="map" aria-label="台风复盘地图"></div>

<header id="brand">
  <div class="lab">台风复盘台 · TYPHOON HINDCAST</div>
  <div class="now">
    <span class="zh" id="s-zh">选择台风</span>
    <span class="en" id="s-en"></span>
    <span class="tag hind">回溯校验 · 非预报</span>
  </div>
</header>

<div id="picker">
  <input id="psearch" type="text" placeholder="搜索台风名或编号，点选进入复盘" autocomplete="off">
  <div id="plist"></div>
</div>

<aside id="rail">
  <section class="card" id="card-ag">
    <h3>机构 · 本次发布误差</h3>
    <div id="ag-list"></div>
    <div id="ag-hint" style="font-size:10px;color:var(--dim);margin-top:6px"></div>
  </section>
  <section class="card" id="card-board">
    <h3>全程位置误差榜 · 平均 KM</h3>
    <table class="board"><thead id="board-head"></thead><tbody id="board-body"></tbody></table>
    <div style="font-size:10px;color:var(--dim);margin-top:6px">
      对同一有效时刻的实况位置取大圆距离；括号为样本数。</div>
  </section>
</aside>

<div id="tl">
  <div id="tl-top">
    <button id="play" aria-label="播放">▶</button>
    <span id="tl-when">—</span>
    <input id="scrub" type="range" min="0" max="0" value="0" step="1" aria-label="发布时刻">
  </div>
  <div id="tl-lab" style="margin-top:4px">拖动时间轴 = 倒回到该时刻，看各机构当时最新一版预报叠在实际路径上</div>
</div>

<footer id="foot">
  <span id="foot-src">数据来源：—</span>
  <span>回溯校验基于已发生的实况与各机构历史发布预报，非预报、不构成任何预测意见。 · <a href="./">返回实时态势图</a></span>
</footer>

<div id="notice"><div class="box" id="notice-box">载入中…</div></div>

<script src="vendor/maplibre-gl.js"></script>
<script src="eval.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);

const AGENCY_META = {
  CMA:{c:"#ffffff",zh:"中央气象台"}, JMA:{c:"#b48cf2",zh:"日本气象厅"},
  JTWC:{c:"#59b7ff",zh:"美国JTWC"}, HKO:{c:"#63e0b8",zh:"香港天文台"},
  CWA:{c:"#f2a0e0",zh:"台湾气象署"}, KMA:{c:"#c9d86b",zh:"韩国气象厅"},
};
const GRADE_C = {TD:"#35c46a",TS:"#3f8ef7",STS:"#f2c744",TY:"#f2872e",
  STY:"#ef5aa0",SuperTY:"#e33e3e"};
const gcolor = g => GRADE_C[g] || "#8fa5b8";
const fmtT = ms => {
  const d = new Date(ms), p = n => String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};

let map=null, LAND=null, INDEX=null;
let storm=null, score=null, stops=[], cursor=0;
const agOn={}; let playing=false, timer=null;

function showNotice(html){ $("#notice-box").innerHTML=html; $("#notice").style.display="grid"; }
function hideNotice(){ $("#notice").style.display="none"; }

async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error(url+" → HTTP "+r.status);
  return r.json();
}

/* ---------- 启动 ---------- */
(async function boot(){
  try{
    [LAND, INDEX] = await Promise.all([
      getJSON("assets/land_wp.json"),
      getJSON("../data/archive/index.json"),
    ]);
  }catch(err){
    showNotice("数据加载失败："+err.message+"<br><br>本地开发请在项目根执行<br>"+
      "<code>python3 fetch_typhoon.py --reindex</code><br>再起 "+
      "<code>python3 -m http.server 8000</code>，访问 <code>/web/verify.html</code>");
    return;
  }
  $("#foot-src").textContent = "数据来源：浙江省水利厅台风路径系统（非官方转发，仅技术演示）· 共 "+
    INDEX.n_storms+" 个台风归档";
  buildPicker();
  buildMap();
})();

/* ---------- 台风选择器 ---------- */
function buildPicker(){
  const inp = $("#psearch"), list = $("#plist");
  const render = (q) => {
    q = (q||"").trim().toLowerCase();
    const hit = INDEX.storms.filter(s =>
      !q || (s.name_zh||"").toLowerCase().includes(q) ||
      (s.name_en||"").toLowerCase().includes(q) || String(s.id).includes(q));
    hit.sort((a,b)=> (b.year-a.year) || String(b.id).localeCompare(String(a.id)));
    list.innerHTML="";
    let curY=null;
    for(const s of hit.slice(0,120)){
      if(s.year!==curY){ curY=s.year;
        const h=document.createElement("div"); h.className="pyear";
        h.textContent=curY+" 年"; list.appendChild(h); }
      const row=document.createElement("div"); row.className="prow";
      const g = s.peak_wind_ms>=51?"SuperTY":s.peak_wind_ms>=41.5?"STY":
        s.peak_wind_ms>=32.7?"TY":s.peak_wind_ms>=24.5?"STS":
        s.peak_wind_ms>=17.2?"TS":"TD";
      row.innerHTML = `<span class="dot" style="background:${gcolor(g)}"></span>`+
        `<span class="nm">${s.name_zh||s.name_en||s.id}</span>`+
        `<span class="meta">${s.id} · ${s.n_forecasts}份预报</span>`;
      row.onclick=()=>{ list.classList.remove("open"); inp.value=s.name_zh||s.id;
        selectStorm(s); };
      list.appendChild(row);
    }
    list.classList.add("open");
  };
  inp.addEventListener("focus",()=>render(inp.value));
  inp.addEventListener("input",()=>render(inp.value));
  document.addEventListener("click",e=>{
    if(!$("#picker").contains(e.target)) list.classList.remove("open"); });
}

async function selectStorm(meta){
  showNotice("载入 "+(meta.name_zh||meta.id)+" 的完整预报史…");
  let s;
  try{ s = await getJSON(`../data/archive/${meta.year}/${meta.id}.json`); }
  catch(err){ showNotice("载入失败："+err.message); return; }
  storm = s;
  score = TLEval.scoreStorm(s);
  hideNotice();
  $("#s-zh").textContent = s.name_zh||s.name_en||s.id;
  $("#s-en").textContent = (s.name_en||"")+" · "+s.id;
  // 发布时刻停靠点 = 全机构 issued_at 并集
  const set = new Set(); (s.forecasts||[]).forEach(f=>set.add(f.issued_at));
  stops = [...set].sort();
  cursor = stops.length-1;
  // 机构开关
  for(const ag of score.agencies) if(!(ag in agOn)) agOn[ag]=true;
  buildAgencyList(); buildBoard();
  const sc=$("#scrub"); sc.max=Math.max(0,stops.length-1); sc.value=cursor;
  drawObserved(); renderCursor(); fitStorm();
}

/* ---------- 机构列表 + 误差榜 ---------- */
function buildAgencyList(){
  const box=$("#ag-list"); box.innerHTML="";
  for(const ag of score.agencies){
    const m=AGENCY_META[ag]||{c:"#9ab",zh:ag};
    const row=document.createElement("label"); row.className="ag-row";
    row.innerHTML=`<input type="checkbox" ${agOn[ag]?"checked":""}>`+
      `<span class="sw" style="color:${m.c}"></span>`+
      `<span class="nm" style="color:${m.c}">${ag}</span>`+
      `<span class="zh">${m.zh}</span><span class="err" data-ag="${ag}">—</span>`;
    row.querySelector("input").onchange=e=>{ agOn[ag]=e.target.checked; renderCursor(); };
    box.appendChild(row);
  }
}

function buildBoard(){
  const buckets=score.buckets;
  $("#board-head").innerHTML="<tr><th class=l>机构</th>"+
    "<th>全程</th>"+buckets.map(b=>`<th>${b}h</th>`).join("")+"</tr>";
  const rank=TLEval.agencyRanking(score,3);
  const bestAg=rank.length?rank[0].agency:null;
  const body=$("#board-body"); body.innerHTML="";
  // 按总榜排序展示，未进榜（样本不足）的接在后面
  const ordered=[...rank.map(r=>r.agency),
    ...score.agencies.filter(a=>!rank.find(r=>r.agency===a))];
  ordered.forEach((ag,i)=>{
    const t=score.table[ag], m=AGENCY_META[ag]||{c:"#9ab"};
    const tr=document.createElement("tr"); if(ag===bestAg) tr.className="best";
    const cell=b=>{ const x=t.byBucket[b]; return `<td>${x?Math.round(x.posMean):"—"}</td>`; };
    tr.innerHTML=`<td class=l><span class="rankdot">${i<rank.length?i+1:"·"}</span>`+
      `<span style="color:${m.c}">${ag}</span></td>`+
      `<td>${t.posMean!=null?Math.round(t.posMean):"—"} `+
      `<span style="color:var(--dim)">(${t.n})</span></td>`+
      buckets.map(cell).join("");
    body.appendChild(tr);
  });
}

/* ---------- 地图 ---------- */
function emptyFC(){ return {type:"FeatureCollection",features:[]}; }
function buildMap(){
  map = new maplibregl.Map({
    container:"map",
    attributionControl:{compact:true,customAttribution:"陆地 Natural Earth · 台风数据见页脚"},
    style:{version:8, sources:{land:{type:"geojson",data:LAND}}, layers:[
      {id:"bg",type:"background",paint:{"background-color":"#0d1b2c"}},
      {id:"land",type:"fill",source:"land",paint:{"fill-color":"#16283a"}},
      {id:"coast",type:"line",source:"land",paint:{"line-color":"#2c4a63","line-width":1}},
    ]},
    center:[128,24], zoom:3.4, minZoom:2.2, maxZoom:9, maxBounds:[[84,-12],[182,58]],
  });
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),"bottom-right");
  map.on("load",()=>{
    // 实况：已知段（实线）/ 发布后段（虚线）
    map.addSource("obs-past",{type:"geojson",data:emptyFC()});
    map.addLayer({id:"obs-past",type:"line",source:"obs-past",
      layout:{"line-cap":"round"},paint:{"line-color":"#4a6076","line-width":3}});
    map.addSource("obs-future",{type:"geojson",data:emptyFC()});
    map.addLayer({id:"obs-future",type:"line",source:"obs-future",
      paint:{"line-color":"#4a6076","line-width":2,"line-dasharray":[1.5,1.5],
        "line-opacity":.6}});
    map.addSource("obs-pt",{type:"geojson",data:emptyFC()});
    map.addLayer({id:"obs-pt",type:"circle",source:"obs-pt",
      paint:{"circle-color":["get","c"],"circle-radius":3,
        "circle-stroke-color":"#0a1420","circle-stroke-width":1}});
    // 误差连线（预报点 → 同刻实况）
    map.addSource("err",{type:"geojson",data:emptyFC()});
    map.addLayer({id:"err",type:"line",source:"err",
      paint:{"line-color":["get","c"],"line-width":1,"line-opacity":.5}});
    // 各机构预报（当前发布时刻）
    map.addSource("fc-line",{type:"geojson",data:emptyFC()});
    map.addLayer({id:"fc-line",type:"line",source:"fc-line",
      paint:{"line-color":["get","c"],"line-width":2,"line-dasharray":[2,1.5]}});
    map.addSource("fc-pt",{type:"geojson",data:emptyFC()});
    map.addLayer({id:"fc-pt",type:"circle",source:"fc-pt",
      paint:{"circle-color":"#0d1b2c","circle-radius":3.5,
        "circle-stroke-color":["get","c"],"circle-stroke-width":1.6}});
    const popup=new maplibregl.Popup({closeButton:false,offset:8});
    map.on("click","fc-pt",e=>{ const p=e.features[0].properties;
      popup.setLngLat(e.lngLat).setHTML(
        `${p.agency} 预报 +${p.lead}h<br>误差 ${Math.round(p.err)} km`).addTo(map); });
    map.on("mouseenter","fc-pt",()=>map.getCanvas().style.cursor="pointer");
    map.on("mouseleave","fc-pt",()=>map.getCanvas().style.cursor="");
    hideNotice();
    showNotice("在右上角搜索并点选一个台风，开始复盘。<br>"+
      "例如搜「巴威」。拖底部时间轴倒回不同发布时刻。");
    $("#notice").addEventListener("click",hideNotice,{once:true});
  });
  bindUI();
}

function drawObserved(){
  const tr=storm.track, pts=tr.map(p=>[p.lon,p.lat]);
  map.getSource("obs-pt").setData({type:"FeatureCollection",
    features:tr.map(p=>({type:"Feature",properties:{c:gcolor(p.grade)},
      geometry:{type:"Point",coordinates:[p.lon,p.lat]}}))});
  // past/future 由 cursor 决定，在 renderCursor 内切分
}

function fitStorm(){
  const tr=storm.track, lons=tr.map(p=>p.lon), lats=tr.map(p=>p.lat);
  map.fitBounds([[Math.min(...lons),Math.min(...lats)],
    [Math.max(...lons),Math.max(...lats)]],
    {padding:{top:120,bottom:150,left:60,right:320},duration:500,maxZoom:6});
}

/* 找某机构截至 tc 的最新一版预报 */
function fcAsOf(agency, tcMs){
  let best=null, bt=-1;
  for(const f of storm.forecasts) if(f.agency===agency){
    const iss=Date.parse(f.issued_at);
    if(iss<=tcMs && iss>bt){ bt=iss; best=f; }
  }
  return best;
}

function renderCursor(){
  if(!storm) return;
  const tc = stops.length ? Date.parse(stops[cursor]) : 0;
  $("#tl-when").textContent = stops.length ? "发布时刻 "+fmtT(tc) : "—";
  // 实况按 cursor 切成 已知/未来
  const tr=storm.track;
  const past=[], fut=[];
  for(let i=0;i<tr.length;i++){
    const c=[tr[i].lon,tr[i].lat];
    if(Date.parse(tr[i].t)<=tc){ past.push(c); }
    else { if(past.length && !fut.length) fut.push(past[past.length-1]); fut.push(c); }
  }
  map.getSource("obs-past").setData(lineFC(past));
  map.getSource("obs-future").setData(lineFC(fut));

  const fcLines=[], fcPts=[], errLines=[];
  const agErr={};
  for(const ag of score.agencies){
    if(!agOn[ag]) continue;
    const f=fcAsOf(ag,tc); if(!f) continue;
    const m=AGENCY_META[ag]||{c:"#9ab"};
    const v=TLEval.verifyIssuance(tr,f);
    const coords=[]; const errs=[];
    for(const p of v.points){
      coords.push([p.fc[1],p.fc[0]]);
      errs.push(p.posErrKm);
      fcPts.push({type:"Feature",properties:{c:m.c,agency:ag,lead:p.lead,err:p.posErrKm},
        geometry:{type:"Point",coordinates:[p.fc[1],p.fc[0]]}});
      errLines.push({type:"Feature",properties:{c:m.c},geometry:{type:"LineString",
        coordinates:[[p.fc[1],p.fc[0]],[p.obs[1],p.obs[0]]]}});
    }
    if(coords.length){
      // 预报线从发布时刻的实况位置起步
      const start=TLEval.interpObserved(tr,Date.parse(f.issued_at));
      if(start) coords.unshift([start.lon,start.lat]);
      fcLines.push({type:"Feature",properties:{c:m.c},
        geometry:{type:"LineString",coordinates:coords}});
    }
    agErr[ag]=errs.length?errs.reduce((a,b)=>a+b,0)/errs.length:null;
  }
  map.getSource("fc-line").setData({type:"FeatureCollection",features:fcLines});
  map.getSource("fc-pt").setData({type:"FeatureCollection",features:fcPts});
  map.getSource("err").setData({type:"FeatureCollection",features:errLines});
  // 机构行的本次误差
  document.querySelectorAll(".err[data-ag]").forEach(el=>{
    const e=agErr[el.dataset.ag];
    el.textContent = e==null ? "—" : Math.round(e)+" km";
    el.style.color = e==null ? "var(--dim)" : "var(--text)";
  });
  const shown=Object.values(agErr).filter(x=>x!=null).length;
  $("#ag-hint").textContent = shown
    ? "当前发布时刻各机构最新一版预报 vs 实际路径，连线即误差。"
    : "该时刻尚无机构发布预报，向右拖动时间轴。";
}
function lineFC(coords){ return coords.length>1 ?
  {type:"FeatureCollection",features:[{type:"Feature",properties:{},
    geometry:{type:"LineString",coordinates:coords}}]} : emptyFC(); }

/* ---------- 交互 ---------- */
function bindUI(){
  $("#scrub").addEventListener("input",e=>{ cursor=+e.target.value; stopPlay(); renderCursor(); });
  $("#play").onclick=()=> playing?stopPlay():startPlay();
}
function startPlay(){
  if(!stops.length) return;
  playing=true; $("#play").textContent="❚❚";
  timer=setInterval(()=>{
    cursor=(cursor+1)%stops.length; $("#scrub").value=cursor; renderCursor();
  },700);
}
function stopPlay(){ playing=false; $("#play").textContent="▶"; clearInterval(timer); }
</script>
</body>
</html>
